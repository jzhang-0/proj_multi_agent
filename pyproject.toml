[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "proj-multi-agent"
version = "0.1.0"
description = "一台机器上多个 AI CLI 的群聊与指挥中心"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "textual>=1.0",
]

[project.scripts]
console = "console.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bus", "src/console", "src/tmuxctl"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
