[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "amux-team"
version = "0.1.0"
description = "一台机器上多个 AI CLI 的协作团队指挥中心"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ai", "agents", "collaboration", "tmux", "tui"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: System :: Shells",
]
dependencies = [
  "pillow>=10.0",
  "textual>=1.0",
  "watchfiles>=0.24",
]

[project.scripts]
# amux 是对外正名;console 保留为别名,历史 Goal 证据里的 `uv run console` 不能失效。
amux = "console.cli:main"
console = "console.cli:main"
roster = "roster.__main__:main"

[project.urls]
Homepage = "https://github.com/jzhang-0/proj_multi_agent"
Repository = "https://github.com/jzhang-0/proj_multi_agent.git"
Issues = "https://github.com/jzhang-0/proj_multi_agent/issues"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = [
  "src/amux_runtime",
  "src/bus",
  "src/console",
  "src/control",
  "src/gateway",
  "src/qa",
  "src/roster",
  "src/team",
  "src/tmuxctl",
  "src/workspace",
  "src/work",
]

[tool.hatch.build.targets.sdist]
include = [
  "/AGENTS.md",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/roster.toml",
  "/src",
  "/tests",
  "/uv.lock",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
# v0 入口在切进 3.11 项目环境之前就要跑,版本判断必须留着
"hub.py" = ["UP036"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
